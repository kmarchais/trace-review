  // ---- file tree drawer (navigate a big diff by path) ----
  function collectTreeFiles(sec){
    return visibleEvidenceFiles(sec).map(el=>{
      const p = el.dataset.file || "";
      const num = (sel)=>{ const t=el.querySelector(".file-header "+sel); return t?parseInt(t.textContent.replace(/[^0-9]/g,""))||0:0; };
      return { path:p, change:el.dataset.change||"", topic:el.querySelector(".change-range")?.textContent||"", name:p.split("/").pop(), add:num(".stat-add"), del:num(".stat-del"), viewed:el.classList.contains("viewed") };
    });
  }
  function treeModel(files){
    const root = { dirs:{}, files:[] };
    for(const f of files){
      const parts = f.path.split("/"); let n = root;
      for(let i=0;i<parts.length-1;i++){ const d=parts[i]; n.dirs[d]=n.dirs[d]||{dirs:{},files:[]}; n=n.dirs[d]; }
      n.files.push(f);
    }
    return root;
  }
  function renderTreeDir(node){
    let html="";
    Object.keys(node.dirs).sort((a,b)=>a.localeCompare(b)).forEach(name0=>{
      let name=name0, child=node.dirs[name0];
      // compact single-child directory chains (src/main/java → one row)
      while(child.files.length===0 && Object.keys(child.dirs).length===1){
        const only=Object.keys(child.dirs)[0]; name=name+"/"+only; child=child.dirs[only];
      }
      html += `<li class="ft-dir"><div class="ft-row ft-dirrow"><span class="ft-tw">▾</span><span class="ft-name">${escAttr(name)}</span></div><ul class="ft-children">${renderTreeDir(child)}</ul></li>`;
    });
    node.files.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{
      html += `<li class="ft-file${f.viewed?" viewed":""}" data-file="${escAttr(f.path)}"${f.change?` data-change="${escAttr(f.change)}"`:""}><div class="ft-row"><span class="ft-name" title="${escAttr(f.path)}">${escAttr(f.name)}${f.topic?`<small class="ft-topic">${escAttr(f.topic)}</small>`:""}</span><span class="ft-stats"><span class="stat-add">+${f.add}</span> <span class="stat-del">-${f.del}</span></span></div></li>`;
    });
    return html;
  }
  function refreshTree(){
    const w = document.getElementById("fileTree"); if(!w || w.hidden) return;

    const files = collectTreeFiles(sec);

    w.querySelector(".ft-count").textContent = files.length + " file" + (files.length===1?"":"s");
    w.querySelector(".ft-viewed").textContent = viewed + "/" + files.length + " viewed";

  function toggleTree(){

  document.querySelectorAll(".dbh-tree").forEach(b=> b.addEventListener("click", toggleTree));

    const sec = activeSection(); if(!sec) return;
    const el = visibleEvidenceFiles(sec).find(f=>
      fr.dataset.change
        ? f.dataset.change===fr.dataset.change
        : f.dataset.file===fr.dataset.file
    );
    if(el){ const g=el.closest(".group"); if(g) g.classList.remove("collapsed"); el.classList.remove("collapsed"); scrollFileToTop(el); }
  });
  document.querySelectorAll("#fileTree [data-ft]").forEach(b=> b.addEventListener("click", ()=>{
    const collapse = b.dataset.ft==="collapse";
    document.querySelectorAll("#fileTree .ft-dir").forEach(d=>d.classList.toggle("collapsed", collapse));
  }));

  // ---- tabs ----
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      const id = tab.dataset.tab;
      document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t===tab));
      document.querySelectorAll("section.pr").forEach(s=>{ s.hidden = s.dataset.pr !== id; });
      window.scrollTo(0,0);
      updateProgress();
      refreshTree();
    });
  });

  // ---- diff mode (persisted view pref) ----
  let mode = "unified";
  try { const m = localStorage.getItem(MODE_KEY); if(m==="split"||m==="unified") mode=m; } catch(e){}
  function setMode(m){
    mode = m; try{ localStorage.setItem(MODE_KEY, m); }catch(e){}
    document.querySelectorAll(".diff-mode-seg button").forEach(b=>b.classList.toggle("active", b.dataset.mode===m));
    renderAll(m);
  }
  document.querySelectorAll(".diff-mode-seg button").forEach(b=> b.addEventListener("click", ()=>setMode(b.dataset.mode)));

  // ---- theme: system default, session override cycle (not persisted) ----
  const themeBtn = document.getElementById("themeBtn");
  const THEMES = [
    {v:null, icon:"◐", label:"system"},
    {v:"light", icon:"☀", label:"light"},
    {v:"dark", icon:"☾", label:"dark"},
  ];
  let ti = 0;
  themeBtn.addEventListener("click", ()=>{
    ti = (ti+1) % THEMES.length; const t = THEMES[ti];
    if(t.v) document.documentElement.setAttribute("data-theme", t.v);
    else document.documentElement.removeAttribute("data-theme");
    themeBtn.textContent = t.icon; themeBtn.title = "Theme: " + t.label;
  });

  // ---- export ----
  function attachmentMarkdown(id,indent=""){
    return attachmentItems(id).map((item,index)=>indent+"![Pasted image "+(index+1)+"]("+item.data+")").join("\n");
  }
  function buildMarkdown(){
    let out = "# " + TITLE + "\n_" + SUBTITLE + "_\n"; let any=false;
    document.querySelectorAll("section.pr").forEach(sec=>{
      const pr = sec.dataset.pr; const title = sec.querySelector(".summary-head h2")?.textContent || sec.querySelector("h2")?.textContent || pr;
      let block="";
      // decisions on Claude's automatic review
      const rev = REVIEW[pr];
      if(rev && rev.comments.length){
        block += "\n**On the " + REVIEWER + " review:**\n";
        for(const c of rev.comments){
          const s = state.aiState[pr+" "+c.aid] || "open";
          block += "- [" + s + "] " + c.file + " L" + c.line + " (" + c.severity + ", " + Math.round(c.confidence*100) + "% confidence) — " + c.body.replace(/\n+/g," ").trim() + " Rationale: " + c.rationale.replace(/\n+/g," ").trim() + "\n";
        }
      }
      const gen=(state.general[pr]||"").trim();
      const generalAttachments=attachmentMarkdown(attachmentId("general",pr,"",""));
      if(gen||generalAttachments){
        block += "\n**My overall:**" + (gen ? " " + gen : "") + "\n";
        if(generalAttachments) block += generalAttachments + "\n";
      }
      const byFile = {};
      const F = (f)=> byFile[f] = byFile[f] || { note:"", lines:[] };
      for(const k in state.files){ const c=state.files[k]; if(!c||c.pr!==pr||!hasCommentContent(c.text,attachmentId("file",c.pr,c.file,""))) continue; F(c.file).note = c.text; }
      for(const k in state.lines){ const c=state.lines[k]; if(!c||c.pr!==pr||!hasCommentContent(c.text,attachmentId("line",c.pr,c.file,c.key))) continue; F(c.file).lines.push(c); }
      for(const file in byFile){
        block += "\n### " + file + "\n";
        const fm = byFile[file];
        const fileAttachments=attachmentMarkdown(attachmentId("file",pr,file,""),"  ");
        if(fm.note||fileAttachments){
          block += "- **File:**" + (fm.note ? " " + fm.note.replace(/\n+/g," ").trim() : " Pasted image") + "\n";
          if(fileAttachments) block += fileAttachments + "\n";
        }
        fm.lines.sort((a,b)=>(parseInt(a.lineno)||0)-(parseInt(b.lineno)||0));
        for(const c of fm.lines){
          const lineAttachments=attachmentMarkdown(attachmentId("line",pr,c.file,c.key),"  ");
          block += "- **L" + c.lineno + "** — " + (c.text ? c.text.replace(/\n+/g," ").trim() : "Pasted image") + "\n";
          if(c.code && c.code.trim()) block += "  > `" + c.code.trim().slice(0,160) + "`\n";
          if(lineAttachments) block += lineAttachments + "\n";
        }
      }
      const orphans=orphanedComments().filter(([,comment])=>comment.pr===pr);
      if(orphans.length){
        block += "\n### Orphaned comments\n";
        for(const [,comment] of orphans){
          block += "- **" + comment.file + ":" + (comment.lineno||comment.key) + "** — " + (comment.text||"Pasted image").replace(/\n+/g," ").trim() + "\n";
        }
      }
      if(block.trim()){ any=true; out += "\n## " + title + "\n" + block; }
    });
    if(!any) out += "\n_No comments yet._\n";
    return out;
  }
  const modal = document.getElementById("exportModal");
  const exportText = document.getElementById("exportText");
  async function copyMarkdown(markdown){
    exportText.value=markdown;
    try {
      await navigator.clipboard.writeText(markdown);
      return true;
    } catch(e) {
      try {
        exportText.select();
        return document.execCommand("copy");
      } catch(fallbackError) {
        return false;
      }
    }
  }
  document.getElementById("copyCommentsBtn").addEventListener("click", async ()=>{
    const button=document.getElementById("copyCommentsBtn");
    if(await copyMarkdown(buildMarkdown())){
      button.textContent="Copied ✓";
      setTimeout(()=>button.textContent="Copy comments",1800);
    } else {
      modal.hidden=false;
      exportText.focus();
      exportText.select();
    }
  });
  document.getElementById("exportBtn").addEventListener("click", ()=>{ exportText.value = buildMarkdown(); modal.hidden=false; });
  document.getElementById("closeModal").addEventListener("click", ()=> modal.hidden=true);
  modal.addEventListener("click", e=>{ if(e.target===modal) modal.hidden=true; });
  document.getElementById("copyBtn").addEventListener("click", async ()=>{
    if(await copyMarkdown(exportText.value)){
      const m=document.getElementById("copiedMsg"); m.hidden=false; setTimeout(()=>m.hidden=true,1800);
    }
  });
  document.getElementById("downloadBtn").addEventListener("click", ()=>{
    const blob = new Blob([exportText.value], {type:"text/markdown"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "review-comments-" + REVIEW_ID + ".md"; a.click(); URL.revokeObjectURL(a.href);
  });

  // ---- staged journey + adaptive evidence workspace ----
  function setOrderView(sec,raw){
    const button=sec.querySelector(".raw-order-toggle");
    if(button){
      button.setAttribute("aria-pressed",String(raw));
      button.textContent=raw ? "Grouped order" : "Git order";
    }
    sec.querySelectorAll("[data-order-view]").forEach(view=>{ view.hidden=view.dataset.orderView!==(raw?"raw":"grouped"); });
    const readingOrder=sec.querySelector(".reading-order"); if(readingOrder) readingOrder.hidden=raw;
    refreshTree();
    updateProgress();
  }
  document.querySelectorAll(".review-journey button").forEach(button=>{
    button.addEventListener("click", ()=>{
      const sec=button.closest("section.pr"), stage=button.dataset.reviewStage;
      sec.dataset.activeStage=stage;
      sec.querySelectorAll(".review-journey button").forEach(candidate=>{
        if(candidate===button) candidate.setAttribute("aria-current","step");
        else candidate.removeAttribute("aria-current");
      });
      if(stage==="validate") setOrderView(sec,false);
      const target = stage==="understand"
        ? sec.querySelector(".pr-context, .review-top")
        : stage==="validate"
          ? sec.querySelector(".group-workspace, .files")
          : sec.querySelector(".diff-block");
      if(target) target.scrollIntoView({block:"start",behavior:"smooth"});
    });
  });
  document.querySelectorAll(".context-toggle").forEach(button=>{
    button.addEventListener("click", ()=>{
      const cols=button.closest(".pr-cols");
      const pressed=cols.classList.toggle("context-collapsed");
      button.setAttribute("aria-pressed", String(pressed));
      button.textContent=pressed ? "Show context" : "Context";
    });
  });
  document.querySelectorAll(".focus-mode-toggle").forEach(button=>{
    button.addEventListener("click", ()=>{
      const cols=button.closest(".pr-cols");
      const pressed=cols.classList.toggle("focus-mode");
      button.setAttribute("aria-pressed", String(pressed));
      button.textContent=pressed ? "Exit focus" : "Focus";
    });
  });
  document.querySelectorAll(".raw-order-toggle").forEach(button=>{
    button.addEventListener("click", ()=>{
      const sec=button.closest("section.pr");
      const raw=button.getAttribute("aria-pressed")!=="true";
      setOrderView(sec,raw);
    });
  });

  // ---- resizable columns (drag the divider; double-click resets the adaptive default) ----
  try { const w = localStorage.getItem("htmlreview:leftw"); if(w) document.documentElement.style.setProperty("--left-w", w); } catch(e){}
  let rzTarget = null;
  document.addEventListener("mousedown", (e)=>{ const rz=e.target.closest(".col-resizer"); if(!rz) return; rzTarget=rz.closest(".pr-cols"); rz.classList.add("active"); document.body.style.userSelect="none"; e.preventDefault(); });
  document.addEventListener("mousemove", (e)=>{ if(!rzTarget) return; const rect=rzTarget.getBoundingClientRect(); let pct=(e.clientX-rect.left)/rect.width*100; pct=Math.max(20,Math.min(80,pct)); document.documentElement.style.setProperty("--left-w", pct.toFixed(1)+"%"); });
  document.addEventListener("mouseup", ()=>{ if(!rzTarget) return; document.querySelectorAll(".col-resizer.active").forEach(r=>r.classList.remove("active")); document.body.style.userSelect=""; try{ localStorage.setItem("htmlreview:leftw", document.documentElement.style.getPropertyValue("--left-w")||"50%"); }catch(e){} rzTarget=null; });
  document.addEventListener("dblclick", (e)=>{ if(!e.target.closest(".col-resizer")) return; document.documentElement.style.setProperty("--left-w","34%"); try{ localStorage.setItem("htmlreview:leftw","34%"); }catch(e){} });

  // ---- diagram / image lightbox (click to fullscreen) ----
  const lb = document.getElementById("lightbox"), lbInner = lb.querySelector(".lb-inner");
  document.addEventListener("click", (e)=>{
    if(!lb.hidden && lb.contains(e.target)){ lb.hidden=true; lbInner.innerHTML=""; return; }
    const pasted = e.target.closest(".comment-attachment img");
    const db = e.target.closest(".diagram-body");
    const g = pasted || (db && db.querySelector("svg,img")); if(!g) return;
    lbInner.innerHTML=""; lbInner.appendChild(g.cloneNode(true)); lb.hidden=false;
  });

  // ---- fullscreen the diff ----
  // The .maximized CSS overlay is the source of truth (instant, works anywhere);
  // native Fullscreen is a best-effort upgrade to also hide browser chrome.
  function enterMax(db){ db.classList.add("maximized"); if(db.requestFullscreen) db.requestFullscreen().catch(()=>{}); }
  function exitMax(db){ db.classList.remove("maximized"); if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }
  document.querySelectorAll(".dbh-fs").forEach(btn=>{
    btn.addEventListener("click", ()=>{ const db=btn.closest(".diff-block"); db.classList.contains("maximized") ? exitMax(db) : enterMax(db); });
  });
  document.addEventListener("fullscreenchange", ()=>{ if(!document.fullscreenElement) document.querySelectorAll(".diff-block.maximized").forEach(d=>d.classList.remove("maximized")); });

  document.addEventListener("keydown", (e)=>{
    if(e.key!=="Escape") return;
    if(!lb.hidden){ lb.hidden=true; lbInner.innerHTML=""; return; }
    const tree = document.getElementById("fileTree");
    if(tree && !tree.hidden){ toggleTree(); return; }
    document.querySelectorAll(".diff-block.maximized").forEach(d=>exitMax(d));
  });

  // ---- sticky offsets: measure header/tabs/diff-head so file headers stick cleanly ----
  function setStickyVars(){
    const rs = document.documentElement.style;
    const app = document.querySelector(".app-header");
    rs.setProperty("--h-app", (app ? app.offsetHeight : 57) + "px");
    const tabs = document.getElementById("tabs");
    const tabsH = (tabs && getComputedStyle(tabs).display !== "none") ? tabs.offsetHeight : 0;
    rs.setProperty("--h-tabs", tabsH + "px");
    const dh = document.querySelector(".diff-block-head");
    rs.setProperty("--h-diffhead", (dh ? dh.offsetHeight : 42) + "px");
  }
  setStickyVars();
  window.addEventListener("resize", setStickyVars);
  window.addEventListener("load", setStickyVars);

  // ---- overall-review compact drawer: collapsed by default, persisted ----
  let overallCollapsed=true;
  try { overallCollapsed=localStorage.getItem("htmlreview:overallcollapsed")!=="0"; } catch(e){}
  document.body.classList.toggle("oq-collapsed",overallCollapsed);
  document.querySelectorAll(".overall-bar.collapsed").forEach(bar=>bar.classList.remove("collapsed"));
  document.querySelectorAll(".ob-toggle").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const c = document.body.classList.toggle("oq-collapsed");
      try { localStorage.setItem("htmlreview:overallcollapsed", c ? "1" : "0"); } catch(e){}
    });
  });

  // ---- init ----
  setMode(mode);
  renderFindingList();
  updateCounts();
  renderOrphans();
})();
</script>
