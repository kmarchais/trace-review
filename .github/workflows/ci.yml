name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types, lint, formatting, and tests
        run: bun run check

      - name: Smoke-test standard skill installation
        run: |
          install_dir="$(mktemp -d)"
          gh skill install . trace-review --from-local --dir "$install_dir"
          node "$install_dir/trace-review/scripts/validate-review-spec.mjs" \
            --spec "$install_dir/trace-review/examples/review-spec.json"
